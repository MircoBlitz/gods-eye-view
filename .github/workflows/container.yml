name: Container CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build AMD64 and ARM64 images without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build test image
        run: docker build --tag gods-eye-view:test .

      - name: Start keyless test container
        run: docker run --detach --name gods-eye-view-test --publish 4173:4173 gods-eye-view:test

      - name: Wait for health
        run: |
          for attempt in $(seq 1 30); do
            running=$(docker inspect --format '{{.State.Running}}' gods-eye-view-test)
            if [ "$running" != true ]; then
              exit_code=$(docker inspect --format '{{.State.ExitCode}}' gods-eye-view-test)
              docker logs gods-eye-view-test
              if [ "$exit_code" -eq 0 ]; then exit 1; fi
              exit "$exit_code"
            fi
            status=$(docker inspect --format '{{.State.Health.Status}}' gods-eye-view-test)
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              docker logs gods-eye-view-test
              exit 1
            fi
            sleep 2
          done
          docker logs gods-eye-view-test
          exit 1

      - name: Verify root page
        run: curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null

      - name: Verify shared-mode security boundary
        run: |
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -H 'Host: foreign.invalid' http://127.0.0.1:4173/api/cctv/sources)" = 403
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4173/api/setup/status)" = 403
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -H 'Origin: http://foreign.invalid' -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:4173/api/realtime/token)" = 403

      - name: Verify v0.3.0 keyless provider behavior
        run: |
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -H 'Origin: http://127.0.0.1:4173' -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:4173/api/setup/keys)" = 403
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:4173/api/gemini/token)" = 403
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -H 'Origin: http://foreign.invalid' -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:4173/api/gemini/token)" = 403
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -H 'Origin: http://127.0.0.1:4173' -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:4173/api/gemini/token)" = 503
          curl --fail --silent --show-error http://127.0.0.1:4173/api/mapillary/status | python3 -c 'import json, sys; assert json.load(sys.stdin)["configured"] is False'
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4173/api/mapillary/tiles/coverage/11/0/0)" = 503
          curl --fail --silent --show-error 'http://127.0.0.1:4173/api/google/geocode?address=London' | python3 -c 'import json, sys; body = json.load(sys.stdin); assert body["configured"] is False and body["results"] == []'
          curl --fail --silent --show-error 'http://127.0.0.1:4173/api/google/reverse-geocode?lat=51.5&lon=-0.1' | python3 -c 'import json, sys; body = json.load(sys.stdin); assert body["configured"] is False and body["results"] == []'

      - name: Verify new provider request boundaries
        run: |
          for path in /api/mapillary/status '/api/google/geocode?address=London' '/api/google/reverse-geocode?lat=51.5&lon=-0.1'; do
            test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -H 'Origin: http://foreign.invalid' "http://127.0.0.1:4173$path")" = 403
            test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -H 'Origin: null' "http://127.0.0.1:4173$path")" = 403
            test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -H 'Sec-Fetch-Site: cross-site' "http://127.0.0.1:4173$path")" = 403
            test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -H 'X-Forwarded-For: 192.0.2.1' "http://127.0.0.1:4173$path")" = 403
            test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -H 'Host: foreign.invalid' "http://127.0.0.1:4173$path")" = 403
          done

      - name: Record diagnostics
        if: always()
        run: |
          docker inspect gods-eye-view-test || true
          docker logs gods-eye-view-test || true

      - name: Remove test container
        if: always()
        run: docker rm --force gods-eye-view-test || true
