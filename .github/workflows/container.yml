name: Container CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build AMD64 and ARM64 images without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --tag gods-eye-view:test .

      - name: Start keyless test container
        run: docker run --detach --name gods-eye-view-test --publish 4173:4173 gods-eye-view:test

      - name: Wait for health
        run: |
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' gods-eye-view-test)
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              docker logs gods-eye-view-test
              exit 1
            fi
            sleep 2
          done
          docker logs gods-eye-view-test
          exit 1

      - name: Verify root page
        run: curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null

      - name: Record diagnostics
        if: always()
        run: |
          docker inspect gods-eye-view-test || true
          docker logs gods-eye-view-test || true

      - name: Remove test container
        if: always()
        run: docker rm --force gods-eye-view-test || true
