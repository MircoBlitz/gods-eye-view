name: Promote tested image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Tested immutable image version to promote
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: container-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the tested manifest to latest
        run: docker buildx imagetools create --tag ghcr.io/mircoblitz/gods-eye-view:latest ghcr.io/mircoblitz/gods-eye-view:${{ inputs.version }}
